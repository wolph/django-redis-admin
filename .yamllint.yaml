extends: default

ignore:
  - .tox/
  - .venv/
  - docs/_build/

rules:
  # GitHub workflows and most tool configs are single documents without a
  # leading `---`.
  document-start: disable
  # `on:` is a workflow keyword, not a boolean.
  truthy:
    check-keys: false
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
