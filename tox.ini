[tox]
requires =
    tox>=4
    tox-uv>=1
skip_missing_interpreters = true
env_list =
    py{310,311,312,313,314}
    pypy{310,311}
    py312-django42
    py313-django52
    py314-django{60,61}
    lint
    mypy
    pyright
    pyrefly
    codespell
    taplo
    yamllint
    rumdl
    actionlint
    zizmor
    audit
    build
    sdist
    docs
    coverage
labels =
    test = py{310,311,312,313,314}, pypy{310,311}
    compat = py312-django42, py313-django52, py314-django{60,61}
    check = lint, mypy, pyright, pyrefly, codespell, taplo, yamllint, rumdl, actionlint, zizmor, audit
    package = build, sdist

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.10: pypy310
    pypy-3.11: pypy311

[testenv]
runner = uv-venv-lock-runner
extras = tests
# Only the tests extra is needed. Exclude default dev group so PyPy does not
# attempt building packages that lack PyPy wheels.
uv_sync_flags = --no-default-groups
# No lockfile is committed at the library tier. Resolve freshly instead
# of requiring uv.lock via the default --locked.
uv_sync_locked = false
# CI sets COVERAGE_FILE to a per-matrix-cell name so each
# cell data file is unique and the coverage job can combine them.
pass_env = COVERAGE_FILE
# Per-cell coverage gate is disabled. The coverage job is
# the single 100% gate across the entire matrix.
commands = pytest --cov-fail-under=0 {posargs}

# Coverage instrumentation breaks Django's admin autodiscover on PyPy: the
# tracer makes `AdminSite` fail its own isinstance check and startup dies with
# "site must subclass AdminSite" (https://code.djangoproject.com/ticket/35418).
# PyPy therefore runs the suite without coverage. The CPython cells own the
# 100% gate, so nothing is lost from the combined report.
[testenv:pypy{310,311}]
commands = pytest --no-cov {posargs}

# The default cells resolve the newest Django for each Python. These pin the
# oldest supported series and the current releases so a compatibility break
# fails here instead of in a user's project.
[testenv:py{312,313,314}-django{42,52,60,61}]
runner = uv-venv-runner
extras = tests
deps =
    django42: django>=4.2,<5.0
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
commands = pytest --no-cov {posargs}

[testenv:lint]
runner = uv-venv-runner
dependency_groups = dev
commands =
    ruff check .
    ruff format --check .

[testenv:mypy]
runner = uv-venv-runner
dependency_groups = dev
commands = mypy

[testenv:pyright]
runner = uv-venv-runner
dependency_groups = dev
commands = basedpyright

[testenv:pyrefly]
runner = uv-venv-runner
dependency_groups = dev
commands = pyrefly check

[testenv:codespell]
runner = uv-venv-runner
dependency_groups = dev
commands = codespell

# --- Non-Python files -------------------------------------------------------
# Each tool is installed on its own, without the package, so these envs
# build in a second and never depend on the Python matrix.

[testenv:taplo]
description = TOML formatting and syntax
runner = uv-venv-runner
skip_install = true
deps = taplo
commands =
    taplo check pyproject.toml ruff.toml .taplo.toml
    taplo fmt --check --diff pyproject.toml ruff.toml .taplo.toml

[testenv:yamllint]
description = YAML lint, configured in .yamllint.yaml
runner = uv-venv-runner
skip_install = true
deps = yamllint
commands = yamllint --strict .

[testenv:rumdl]
description = Markdown lint, configured in [tool.rumdl]
runner = uv-venv-runner
skip_install = true
deps = rumdl
commands = rumdl check .

[testenv:actionlint]
description = GitHub Actions workflow syntax and expressions
runner = uv-venv-runner
skip_install = true
deps = actionlint-py
commands = actionlint

[testenv:zizmor]
description = GitHub Actions workflow security audit
runner = uv-venv-runner
skip_install = true
deps = zizmor
commands = zizmor --min-severity low .github/workflows

# --- Supply chain -----------------------------------------------------------

[testenv:audit]
description = known vulnerabilities in the resolved development environment
runner = uv-venv-runner
dependency_groups = dev
deps = pip-audit
commands = pip-audit --skip-editable --progress-spinner off

# --- Packaging --------------------------------------------------------------

[testenv:build]
description = build both distributions and check metadata and wheel contents
runner = uv-venv-runner
skip_install = true
deps =
    twine
    check-wheel-contents
allowlist_externals = uv
commands =
    uv build --out-dir {envtmpdir}/dist
    twine check --strict {envtmpdir}/dist/django_redis_admin-*
    check-wheel-contents {envtmpdir}/dist

[testenv:sdist]
description = run the test suite from the unpacked source distribution
runner = uv-venv-runner
skip_install = true
allowlist_externals = uv
commands = python scripts/check_sdist.py {envtmpdir}

[testenv:docs]
runner = uv-venv-runner
extras = docs
commands = sphinx-build -W -b html docs docs/_build/html

[testenv:coverage]
runner = uv-venv-lock-runner
extras = tests
uv_sync_flags = --no-default-groups
uv_sync_locked = false
commands =
    coverage erase
    pytest --cov=redis_admin --cov-report=term-missing --cov-fail-under=100
