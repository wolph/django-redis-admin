name: Release

# Pushing a v* tag builds the distributions, creates the GitHub release with
# generated notes and the distributions attached, then publishes to PyPI
# through Trusted Publishing. Creating a release in the GitHub UI pushes the
# tag as well, so the release step skips creation when it already exists.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: release artifacts must not be built from
      # cacheable state that a pull request could have poisoned.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Verify the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${TAG}" ]
          then
            echo "::error::tag ${TAG} does not match project version ${version}"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uvx check-wheel-contents dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=''
          if echo "${TAG}" | grep -qE '(a|b|rc)[0-9]+$'
          then
            prerelease='--prerelease'
          fi
          if gh release view "${TAG}" >/dev/null 2>&1
          then
            echo "release ${TAG} already exists, attaching distributions"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" \
              --generate-notes ${prerelease}
          fi
          gh release upload "${TAG}" dist/* --clobber

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-redis-admin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
