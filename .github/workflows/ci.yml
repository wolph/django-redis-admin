name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # tox.ini is the single source of truth: every job below runs one tox
  # environment, so `tox -p auto` locally is the same suite as this file.
  # tox-gh-actions maps the runner's Python to its py3xx / pypy3xx env and
  # COVERAGE_FILE gives each cell a unique data file for the combine job.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy3.10', 'pypy3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure redis-server is installed
        run: |
          if ! command -v redis-server >/dev/null 2>&1
          then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}
      - run: uvx --with tox-uv --with tox-gh-actions tox
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
      # PyPy runs without coverage (see tox.ini), so it has nothing to upload.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # Pinned Django series: the oldest supported release and the current ones.
  django-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            env: py312-django42
          - python-version: '3.13'
            env: py313-django52
          - python-version: '3.14'
            env: py314-django60
          - python-version: '3.14'
            env: py314-django61
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure redis-server is installed
        run: |
          if ! command -v redis-server >/dev/null 2>&1
          then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: compat-${{ matrix.env }}
      - run: uvx --with tox-uv tox -e ${{ matrix.env }}

  # The tests inside the built sdist, so a packaging gap fails here rather
  # than on a user's machine.
  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure redis-server is installed
        run: |
          if ! command -v redis-server >/dev/null 2>&1
          then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: sdist
      - run: uvx --with tox-uv tox -e sdist

  # Linters, type checkers, spelling, packaging metadata, docs and the
  # dependency audit. Each is one tox env; see `tox -m check`.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env:
          - lint
          - mypy
          - pyright
          - pyrefly
          - codespell
          - taplo
          - yamllint
          - rumdl
          - actionlint
          - zizmor
          - audit
          - build
          - docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: check-${{ matrix.env }}
      - run: uvx --with tox-uv tox -e ${{ matrix.env }}

  # The real coverage gate: combine every CPython cell's data, enforce 100%.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage report --show-missing --fail-under=100
